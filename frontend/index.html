<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 问答偏好库</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe',
                            300: '#a5b4fc', 400: '#818cf8', 500: '#6366f1',
                            600: '#4f46e5', 700: '#4338ca', 800: '#3730a3',
                        },
                        surface: {
                            0: '#ffffff', 50: '#f8fafc', 100: '#f1f5f9',
                            200: '#e2e8f0', 300: '#cbd5e1',
                            500: '#64748b', 600: '#475569', 800: '#1e293b', 900: '#0f172a',
                        }
                    },
                    boxShadow: {
                        'card': '0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04)',
                        'float': '0 10px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.06)',
                        'glow': '0 0 0 3px rgba(99,102,241,0.15)',
                    },
                    animation: {
                        'slide-up': 'slideUp 0.25s ease-out',
                        'fade-in': 'fadeIn 0.2s ease-out',
                        'pulse-slow': 'pulse 2s cubic-bezier(0.4,0,0.6,1) infinite',
                    },
                    keyframes: {
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(12px) scale(0.98)' },
                            '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
        .glass { backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .scrollbar-thin::-webkit-scrollbar { width: 4px; }
        .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }
        .scrollbar-thin::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-surface-100 text-surface-800 min-h-screen">

    <nav class="sticky top-0 z-50 glass bg-white/80 border-b border-surface-200/60">
        <div class="max-w-[1440px] mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center shadow-md">
                    <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
                    </svg>
                </div>
                <span class="text-lg font-bold bg-gradient-to-r from-brand-600 to-brand-800 bg-clip-text text-transparent">AI 问答偏好库</span>
            </div>
            <div class="flex bg-surface-100 rounded-xl p-1 gap-0.5">
                <button data-page="qa" class="nav-tab px-5 py-2 rounded-lg text-sm font-medium transition-all duration-200 bg-white text-brand-600 shadow-card">💬 问答记录</button>
                <button data-page="documents" class="nav-tab px-5 py-2 rounded-lg text-sm font-medium transition-all duration-200 text-surface-500 hover:text-surface-800">📁 文档管理</button>
                <button data-page="preferences" class="nav-tab px-5 py-2 rounded-lg text-sm font-medium transition-all duration-200 text-surface-500 hover:text-surface-800">⭐ 偏好设置</button>
            </div>
            <div class="flex items-center gap-3">
                <span id="connStatus" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-surface-100 text-surface-500">
                    <span class="w-1.5 h-1.5 rounded-full bg-surface-300"></span>
                    连接中...
                </span>
                <div id="userMenu" class="hidden items-center gap-3">
                    <div id="userAvatar" class="w-8 h-8 rounded-full bg-gradient-to-br from-brand-400 to-brand-600 flex items-center justify-center text-white text-sm font-semibold shadow"></div>
                    <span id="userName" class="text-sm font-medium text-surface-800"></span>
                    <button id="logoutBtn" class="px-3 py-1.5 rounded-lg border border-surface-200 text-xs font-medium text-surface-500 hover:text-brand-600 hover:border-brand-300 transition-all">退出</button>
                </div>
                <button id="loginBtn" class="px-4 py-2 rounded-xl bg-gradient-to-r from-brand-500 to-brand-600 text-white text-sm font-semibold shadow-md hover:shadow-lg transition-all">登录</button>
            </div>
        </div>
    </nav>

    <main id="mainContent" class="max-w-[1440px] mx-auto p-6"></main>

    <div id="authModal" class="fixed inset-0 z-[100] hidden items-center justify-center">
        <div class="absolute inset-0 bg-surface-900/40 backdrop-blur-sm" id="authBackdrop"></div>
        <div class="relative bg-white rounded-2xl shadow-2xl w-[90vw] max-w-[420px] overflow-hidden animate-slide-up">
            <div class="px-8 pt-8 pb-2">
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center shadow-lg mx-auto mb-4">
                    <svg class="w-7 h-7 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
                </div>
                <h3 id="authTitle" class="text-xl font-bold text-center text-surface-800 mb-1">欢迎回来</h3>
                <p class="text-sm text-surface-400 text-center mb-6">登录以管理你的问答偏好</p>
            </div>
            <form id="authForm" class="px-8 pb-8 space-y-4">
                <div class="space-y-1.5">
                    <label class="text-sm font-medium text-surface-700">用户名</label>
                    <input type="text" id="authUsername" placeholder="输入用户名" required class="w-full px-4 py-2.5 rounded-xl border border-surface-200 bg-surface-50 text-sm focus:outline-none focus:border-brand-400 focus:shadow-glow transition-all">
                </div>
                <div class="space-y-1.5">
                    <label class="text-sm font-medium text-surface-700">密码</label>
                    <input type="password" id="authPassword" placeholder="输入密码" required class="w-full px-4 py-2.5 rounded-xl border border-surface-200 bg-surface-50 text-sm focus:outline-none focus:border-brand-400 focus:shadow-glow transition-all">
                </div>
                <div class="flex gap-3 pt-2">
                    <button type="submit" id="authSubmitBtn" class="flex-1 py-3 rounded-xl bg-gradient-to-r from-brand-500 to-brand-600 text-white text-sm font-semibold shadow-md hover:shadow-lg hover:-translate-y-0.5 transition-all duration-200">登录</button>
                    <button type="button" id="authSwitchBtn" class="flex-1 py-3 rounded-xl border border-surface-200 bg-white text-sm font-medium text-surface-600 hover:border-brand-300 hover:text-brand-600 transition-all">去注册</button>
                </div>
            </form>
        </div>
    </div>

    <div id="qaDetailModal" class="fixed inset-0 z-[100] hidden items-center justify-center">
        <div class="absolute inset-0 bg-surface-900/40 backdrop-blur-sm" id="qaDetailBackdrop"></div>
        <div class="relative bg-white rounded-2xl shadow-2xl w-[90vw] max-w-[680px] max-h-[85vh] overflow-hidden animate-slide-up">
            <div class="flex items-center justify-between px-6 py-4 border-b border-surface-100">
                <h3 class="font-semibold text-surface-800">问答详情</h3>
                <button id="closeQADetail" class="w-8 h-8 rounded-lg hover:bg-surface-100 flex items-center justify-center text-surface-400 hover:text-surface-600 transition-all">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div id="qaDetailContent" class="p-6 overflow-y-auto scrollbar-thin"></div>
        </div>
    </div>

    <script>window.API_BASE_URL = 'http://localhost:8000';</script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
