<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChromaDB 文档管理器</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-wrapper">
        <!-- 顶部导航 -->
        <nav class="top-nav">
            <div class="nav-brand">
                <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                    <path d="M2 17l10 5 10-5"/>
                    <path d="M2 12l10 5 10-5"/>
                </svg>
                <span class="brand-text">ChromaDB 文档管理器</span>
            </div>
            <div class="nav-meta">
                <span id="connStatus" class="status-badge connecting">连接中...</span>
            </div>
        </nav>

        <main class="main-content">
            <!-- 左侧边栏 -->
            <aside class="sidebar">
                <div class="sidebar-section">
                    <h4 class="section-title">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                        </svg>
                        集合管理
                    </h4>

                    <div class="form-group">
                        <label>目标集合</label>
                        <div class="select-wrapper">
                            <select id="collectionSelect">
                                <option value="">请选择集合</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>新建集合</label>
                        <div class="input-group">
                            <input type="text" id="newCollectionName" placeholder="输入名称...">
                            <button id="createCollectionBtn" class="btn-icon" title="创建">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                                    <line x1="12" y1="5" x2="12" y2="19"/>
                                    <line x1="5" y1="12" x2="19" y2="12"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="sidebar-divider"></div>

                <div class="sidebar-section">
                    <h4 class="section-title">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="17 8 12 3 7 8"/>
                            <line x1="12" y1="3" x2="12" y2="15"/>
                        </svg>
                        上传配置
                    </h4>

                    <div class="form-group">
                        <label>分块大小</label>
                        <div class="segmented-control">
                            <button class="segment active" data-value="500">500</button>
                            <button class="segment active" data-value="1000">1000</button>
                            <button class="segment" data-value="2000">2000</button>
                        </div>
                        <input type="hidden" id="chunkSize" value="1000">
                    </div>

                    <button id="uploadBtn" class="btn-primary btn-full">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="17 8 12 3 7 8"/>
                            <line x1="12" y1="3" x2="12" y2="15"/>
                        </svg>
                        上传文件
                    </button>
                    <input type="file" id="fileInput" multiple accept=".pdf,.docx" style="display: none;">
                </div>
            </aside>

            <!-- 中间内容区 -->
            <section class="content-area">
                <!-- 拖拽上传区 -->
                <div class="upload-card" id="dropZone">
                    <div class="upload-placeholder">
                        <div class="upload-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="48" height="48">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                <polyline points="17 8 12 3 7 8"/>
                                <line x1="12" y1="3" x2="12" y2="15"/>
                            </svg>
                        </div>
                        <h3>拖拽文件到此处</h3>
                        <p class="upload-hint">支持 PDF、DOCX 格式，单个文件最大 20MB</p>
                        <button class="btn-outline" onclick="document.getElementById('fileInput').click()">
                            选择文件
                        </button>
                    </div>

                    <div id="uploadStatus" class="upload-progress" style="display: none;">
                        <div class="progress-ring">
                            <svg class="progress-spinner" viewBox="0 0 36 36">
                                <circle cx="18" cy="18" r="16" fill="none" stroke="currentColor" stroke-width="3" opacity="0.2"/>
                                <circle cx="18" cy="18" r="16" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="80 100" stroke-linecap="round" class="spinner-track"/>
                            </svg>
                        </div>
                        <span id="uploadStatusText">正在处理...</span>
                    </div>
                </div>

                <!-- 文档预览区 -->
                <div class="preview-card" id="previewPanel" style="display: none;">
                    <div class="preview-toolbar">
                        <h4 id="previewHeader">文档预览</h4>
                        <button class="btn-icon btn-close" id="closePreview" title="关闭">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                                <line x1="18" y1="6" x2="6" y2="18"/>
                                <line x1="6" y1="6" x2="18" y2="18"/>
                            </svg>
                        </button>
                    </div>
                    <div id="previewContent" class="preview-body"></div>
                </div>
            </section>

            <!-- 右侧文档列表 -->
            <aside class="doc-sidebar">
                <div class="doc-sidebar-header">
                    <h4>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                            <line x1="16" y1="13" x2="8" y2="13"/>
                            <line x1="16" y1="17" x2="8" y2="17"/>
                        </svg>
                        文档列表
                    </h4>
                    <div class="select-wrapper small">
                        <select id="docCollectionSelect">
                            <option value="">选择集合</option>
                        </select>
                    </div>
                </div>

                <div id="documentList" class="document-list">
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="40" height="40">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                        </svg>
                        <p>暂无文档</p>
                        <span>选择集合并上传文件</span>
                    </div>
                </div>

                <div id="docCount" class="doc-footer"></div>
            </aside>
        </main>
    </div>

    <script>
        window.API_BASE_URL = 'http://localhost:8000';
    </script>
    <script src="js/app.js"></script>
</body>
</html>
